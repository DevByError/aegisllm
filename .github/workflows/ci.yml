name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Unit tests
        run: pytest
      - name: Red-team suite (gateway, offline)
        run: python eval/run_eval.py --offline-only

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t aegisllm:ci .
      - name: Smoke test
        run: |
          docker run -d --name aegis -p 8088:8088 aegisllm:ci
          for i in $(seq 1 20); do curl -fs http://127.0.0.1:8088/aegis/health && exit 0; sleep 1; done
          docker logs aegis; exit 1
